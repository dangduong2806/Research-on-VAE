experiment:
  name: vanilla_vae_image_64
  seed: 42
  device: auto

data:
  root: data/images
  input_size: [64, 64]
  in_channels: 3
  resize_mode: resize_and_pad
  normalization: minus_one_to_one
  train_batch_size: 32
  val_batch_size: 32
  num_workers: 4

model:
  latent_dim: 128
  encoder:
    hidden_dims: [32, 64, 128, 256, 512]
    kernel_size: 3
    stride: 2
    padding: 1
    normalization: batch_norm
    activation: leaky_relu
    negative_slope: 0.01
  decoder:
    type: conv_transpose
    output_channels: 3
    output_activation: tanh

loss:
  reconstruction: mse
  reconstruction_reduction: mean
  kld_reduction: mean
  beta: 0.00025

optimizer:
  name: adam
  learning_rate: 0.001
  weight_decay: 0.0

training:
  epochs: 100
  save_every: 5
  validate_every: 1

logging:
  output_dir: outputs/vanilla_vae_image_64
  log_images_every: 500
  trace_shapes: true
